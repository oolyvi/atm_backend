services:
  postgres:
    image: postgres:17
    container_name: atm
    environment:
      POSTGRES_DB: ${DB_NAME:-atm_db}
      POSTGRES_USER: ${DB_USERNAME:-atm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-atm_password}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: